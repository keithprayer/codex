name: BTC Checks
on:
  pull_request:
    paths: ['btc-ecosystem-monitor/**', '.github/workflows/btc-*.yml']
  push:
    branches: [main]
    paths: ['btc-ecosystem-monitor/**', '.github/workflows/btc-*.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: btc-ecosystem-monitor
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run check
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: btc-site-preview
          path: btc-ecosystem-monitor/dist
